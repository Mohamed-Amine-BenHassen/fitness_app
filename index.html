<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1116" />
    <meta name="description" content="Offline Push/Pull/Legs workout and protein tracker." />
    <title>PPL Tracker</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-bar">
      <div>
        <h1 id="app-title">Workout</h1>
        <p id="app-date" class="app-date"></p>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tab-bar" aria-label="Sections">
      <button type="button" class="tab" data-tab="workout" aria-current="page">
        <span class="tab-label">Workout</span>
      </button>
      <button type="button" class="tab" data-tab="protein">
        <span class="tab-label">Protein</span>
      </button>
      <button type="button" class="tab" data-tab="backup">
        <span class="tab-label">Backup</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
